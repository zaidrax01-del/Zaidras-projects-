<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>$BREAD — Feed the Community. Not the Whales.</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,400;14..32,500;14..32,600;14..32,700;14..32,800;14..32,900&display=swap" rel="stylesheet" />
    <!-- Font Awesome 6 (free) for official social icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" />
    <style>
        /* ===== RESET & BASE ===== */
        *,
        *::before,
        *::after {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
            --gold: #F5A623;
            --gold-light: #F7C948;
            --gold-dark: #C47A1A;
            --cream: #FFF8F0;
            --brown: #5D3A1A;
            --brown-light: #8B5E3C;
            --brown-dark: #3E2510;
            --warm-white: #FFFAF5;
            --shadow: 0 8px 32px rgba(93, 58, 26, 0.15);
            --radius: 20px;
            --transition: 0.4s cubic-bezier(0.25, 0.46, 0.45, 0.94);
        }

        html {
            scroll-behavior: smooth;
        }

        body {
            font-family: 'Inter', sans-serif;
            background: var(--cream);
            color: var(--brown-dark);
            line-height: 1.6;
            overflow-x: hidden;
        }

        a {
            text-decoration: none;
            color: inherit;
        }

        img {
            max-width: 100%;
            display: block;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 0 24px;
        }

        /* ===== FLOATING BREAD PARTICLES ===== */
        #particles-canvas {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 0;
        }

        /* ===== SCROLLBAR ===== */
        ::-webkit-scrollbar {
            width: 8px;
        }
        ::-webkit-scrollbar-track {
            background: var(--cream);
        }
        ::-webkit-scrollbar-thumb {
            background: var(--gold);
            border-radius: 10px;
        }
        ::-webkit-scrollbar-thumb:hover {
            background: var(--gold-dark);
        }

        /* ===== HEADER / NAV ===== */
        header {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            z-index: 1000;
            padding: 16px 0;
            background: rgba(255, 248, 240, 0.85);
            backdrop-filter: blur(16px);
            border-bottom: 2px solid rgba(245, 166, 35, 0.2);
            transition: var(--transition);
        }

        header.scrolled {
            box-shadow: 0 4px 24px rgba(93, 58, 26, 0.08);
        }

        .nav-container {
            display: flex;
            align-items: center;
            justify-content: space-between;
            max-width: 1200px;
            margin: 0 auto;
            padding: 0 24px;
        }

        .logo-wrapper {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .logo-wrapper img {
            height: 44px;
            width: 44px;
            border-radius: 50%;
            object-fit: cover;
            border: 2px solid var(--gold);
            box-shadow: 0 0 20px rgba(245, 166, 35, 0.25);
        }

        .logo-text {
            font-size: 1.6rem;
            font-weight: 900;
            background: linear-gradient(135deg, var(--gold-dark), var(--gold), var(--gold-light));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            letter-spacing: -0.5px;
        }
        .logo-text span {
            font-weight: 400;
            -webkit-text-fill-color: var(--brown);
            background: none;
        }

        .nav-links {
            display: flex;
            align-items: center;
            gap: 28px;
            list-style: none;
        }

        .nav-links a {
            font-weight: 500;
            font-size: 0.95rem;
            color: var(--brown);
            transition: var(--transition);
            position: relative;
        }
        .nav-links a::after {
            content: '';
            position: absolute;
            bottom: -4px;
            left: 0;
            width: 0;
            height: 2px;
            background: var(--gold);
            transition: var(--transition);
        }
        .nav-links a:hover::after {
            width: 100%;
        }
        .nav-links a:hover {
            color: var(--gold-dark);
        }

        .nav-cta {
            background: var(--gold);
            color: #fff !important;
            padding: 8px 20px;
            border-radius: 50px;
            font-weight: 700 !important;
            transition: var(--transition);
            box-shadow: 0 4px 16px rgba(245, 166, 35, 0.3);
        }
        .nav-cta::after {
            display: none !important;
        }
        .nav-cta:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 28px rgba(245, 166, 35, 0.45);
            background: var(--gold-dark);
            color: #fff !important;
        }

        .hamburger {
            display: none;
            flex-direction: column;
            gap: 5px;
            cursor: pointer;
            background: none;
            border: none;
            padding: 4px;
        }
        .hamburger span {
            width: 26px;
            height: 3px;
            background: var(--brown);
            border-radius: 4px;
            transition: var(--transition);
        }
        .hamburger.active span:nth-child(1) {
            transform: rotate(45deg) translate(5px, 6px);
        }
        .hamburger.active span:nth-child(2) {
            opacity: 0;
        }
        .hamburger.active span:nth-child(3) {
            transform: rotate(-45deg) translate(5px, -6px);
        }

        /* ===== HERO ===== */
        .hero {
            position: relative;
            z-index: 1;
            min-height: 100vh;
            display: flex;
            align-items: center;
            padding: 120px 0 80px;
            overflow: hidden;
        }

        .hero-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 60px;
            align-items: center;
        }

        .hero-content h1 {
            font-size: 3.8rem;
            font-weight: 900;
            line-height: 1.1;
            margin-bottom: 12px;
            letter-spacing: -1.5px;
        }
        .hero-content h1 .highlight {
            background: linear-gradient(135deg, var(--gold-dark), var(--gold), var(--gold-light));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }
        .hero-content .subtitle {
            font-size: 1.25rem;
            color: var(--brown-light);
            font-weight: 500;
            margin-bottom: 8px;
        }
        .hero-content .tagline {
            font-size: 1.1rem;
            color: var(--brown-light);
            max-width: 480px;
            margin-bottom: 32px;
            opacity: 0.85;
        }

        .hero-buttons {
            display: flex;
            flex-wrap: wrap;
            gap: 16px;
        }

        .btn {
            display: inline-flex;
            align-items: center;
            gap: 10px;
            padding: 14px 34px;
            border-radius: 50px;
            font-weight: 700;
            font-size: 1rem;
            transition: var(--transition);
            border: none;
            cursor: pointer;
            background: var(--brown);
            color: #fff;
            box-shadow: 0 4px 16px rgba(93, 58, 26, 0.15);
        }
        .btn-primary {
            background: linear-gradient(135deg, var(--gold), var(--gold-dark));
            color: #fff;
            box-shadow: 0 4px 24px rgba(245, 166, 35, 0.35);
        }
        .btn-primary:hover {
            transform: translateY(-3px);
            box-shadow: 0 8px 36px rgba(245, 166, 35, 0.5);
        }
        .btn-outline {
            background: transparent;
            color: var(--brown);
            border: 2px solid var(--brown);
            box-shadow: none;
        }
        .btn-outline:hover {
            background: var(--brown);
            color: #fff;
            transform: translateY(-3px);
        }
        .btn-secondary {
            background: var(--brown);
            color: #fff;
        }
        .btn-secondary:hover {
            background: var(--brown-dark);
            transform: translateY(-3px);
            box-shadow: 0 8px 28px rgba(93, 58, 26, 0.3);
        }

        .hero-visual {
            position: relative;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .hero-bread-circle {
            width: 380px;
            height: 380px;
            border-radius: 50%;
            background: radial-gradient(circle at 30% 30%, var(--gold-light), var(--gold), var(--gold-dark));
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 0 20px 80px rgba(245, 166, 35, 0.3);
            animation: floatBread 6s ease-in-out infinite;
            position: relative;
        }
        .hero-bread-circle img {
            width: 200px;
            height: 200px;
            border-radius: 50%;
            object-fit: cover;
            border: 4px solid rgba(255, 255, 255, 0.4);
            box-shadow: 0 0 60px rgba(255, 215, 0, 0.2);
        }

        .floating-emoji {
            position: absolute;
            font-size: 2.4rem;
            animation: floatEmoji 4s ease-in-out infinite;
            filter: drop-shadow(0 4px 12px rgba(0, 0, 0, 0.1));
            pointer-events: none;
        }
        .floating-emoji:nth-child(2) {
            top: -10px;
            right: -20px;
            animation-delay: 0.5s;
            font-size: 2.8rem;
        }
        .floating-emoji:nth-child(3) {
            bottom: -10px;
            left: -20px;
            animation-delay: 1.2s;
            font-size: 2.2rem;
        }
        .floating-emoji:nth-child(4) {
            top: 20%;
            right: -40px;
            animation-delay: 0.8s;
            font-size: 2rem;
        }
        .floating-emoji:nth-child(5) {
            bottom: 20%;
            left: -40px;
            animation-delay: 1.8s;
            font-size: 2.6rem;
        }

        @keyframes floatBread {
            0%,
            100% {
                transform: translateY(0) rotate(0deg);
            }
            50% {
                transform: translateY(-18px) rotate(2deg);
            }
        }
        @keyframes floatEmoji {
            0%,
            100% {
                transform: translateY(0) scale(1);
            }
            50% {
                transform: translateY(-16px) scale(1.08);
            }
        }

        /* ===== SECTION SHARED ===== */
        section {
            position: relative;
            z-index: 1;
            padding: 80px 0;
        }

        .section-label {
            display: inline-block;
            font-size: 0.75rem;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 2px;
            color: var(--gold-dark);
            background: rgba(245, 166, 35, 0.12);
            padding: 4px 16px;
            border-radius: 50px;
            margin-bottom: 12px;
        }

        .section-title {
            font-size: 2.8rem;
            font-weight: 800;
            line-height: 1.15;
            margin-bottom: 16px;
            letter-spacing: -1px;
        }
        .section-title .highlight {
            background: linear-gradient(135deg, var(--gold-dark), var(--gold));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        .section-desc {
            font-size: 1.1rem;
            color: var(--brown-light);
            max-width: 640px;
            opacity: 0.85;
        }

        .text-center {
            text-align: center;
        }
        .mx-auto {
            margin-left: auto;
            margin-right: auto;
        }

        /* ===== ABOUT ===== */
        .about-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 60px;
            align-items: center;
            margin-top: 40px;
        }

        .about-text p {
            margin-bottom: 16px;
            font-size: 1.05rem;
            color: var(--brown-light);
        }
        .about-text p strong {
            color: var(--brown);
        }

        .about-stats {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
        }

        .stat-card {
            background: #fff;
            padding: 28px 20px;
            border-radius: var(--radius);
            box-shadow: var(--shadow);
            text-align: center;
            transition: var(--transition);
            border: 1px solid rgba(245, 166, 35, 0.08);
        }
        .stat-card:hover {
            transform: translateY(-6px);
            box-shadow: 0 12px 48px rgba(93, 58, 26, 0.12);
        }
        .stat-card .number {
            font-size: 2.2rem;
            font-weight: 900;
            color: var(--gold-dark);
        }
        .stat-card .label {
            font-size: 0.9rem;
            color: var(--brown-light);
            font-weight: 500;
        }

        /* ===== MISSION / VISION / VALUES ===== */
        .mission-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
            gap: 30px;
            margin-top: 40px;
        }

        .value-card {
            background: #fff;
            padding: 32px 28px;
            border-radius: var(--radius);
            box-shadow: var(--shadow);
            border: 1px solid rgba(245, 166, 35, 0.06);
            transition: var(--transition);
            text-align: center;
        }
        .value-card:hover {
            transform: translateY(-6px);
            box-shadow: 0 12px 48px rgba(93, 58, 26, 0.10);
        }
        .value-card .icon {
            font-size: 2.8rem;
            margin-bottom: 12px;
        }
        .value-card h3 {
            font-size: 1.3rem;
            font-weight: 700;
            margin-bottom: 8px;
        }
        .value-card p {
            color: var(--brown-light);
            font-size: 0.95rem;
        }

        /* ===== TOKENOMICS ===== */
        .tokenomics-wrapper {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 50px;
            align-items: center;
            margin-top: 40px;
        }

        .token-ring {
            position: relative;
            width: 320px;
            height: 320px;
            margin: 0 auto;
        }
        .token-ring svg {
            width: 100%;
            height: 100%;
            transform: rotate(-90deg);
        }
        .token-ring .center-text {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            text-align: center;
        }
        .token-ring .center-text .amount {
            font-size: 2.4rem;
            font-weight: 900;
            color: var(--brown);
        }
        .token-ring .center-text .label {
            font-size: 0.9rem;
            color: var(--brown-light);
            font-weight: 500;
        }

        .token-list {
            display: flex;
            flex-direction: column;
            gap: 16px;
        }

        .token-item {
            display: flex;
            align-items: center;
            gap: 16px;
            background: #fff;
            padding: 16px 24px;
            border-radius: 14px;
            box-shadow: var(--shadow);
            transition: var(--transition);
            border-left: 4px solid var(--gold);
        }
        .token-item:hover {
            transform: translateX(6px);
        }
        .token-item .color-dot {
            width: 14px;
            height: 14px;
            border-radius: 50%;
            flex-shrink: 0;
        }
        .token-item .info {
            flex: 1;
        }
        .token-item .info .name {
            font-weight: 700;
            font-size: 1rem;
        }
        .token-item .info .desc {
            font-size: 0.85rem;
            color: var(--brown-light);
        }
        .token-item .pct {
            font-weight: 800;
            font-size: 1.1rem;
            color: var(--gold-dark);
        }

        /* ===== ROADMAP ===== */
        .roadmap-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(240px, 1fr));
            gap: 24px;
            margin-top: 40px;
        }

        .roadmap-card {
            background: #fff;
            padding: 28px 24px;
            border-radius: var(--radius);
            box-shadow: var(--shadow);
            border-top: 4px solid var(--gold);
            transition: var(--transition);
            position: relative;
            overflow: hidden;
        }
        .roadmap-card::before {
            content: '';
            position: absolute;
            top: 0;
            right: 0;
            width: 80px;
            height: 80px;
            background: radial-gradient(circle, rgba(245, 166, 35, 0.06), transparent);
            border-radius: 50%;
            transform: translate(30%, -30%);
        }
        .roadmap-card:hover {
            transform: translateY(-6px);
            box-shadow: 0 12px 48px rgba(93, 58, 26, 0.10);
        }
        .roadmap-card .phase {
            font-size: 0.7rem;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 1.5px;
            color: var(--gold-dark);
            background: rgba(245, 166, 35, 0.10);
            display: inline-block;
            padding: 2px 14px;
            border-radius: 50px;
            margin-bottom: 10px;
        }
        .roadmap-card h3 {
            font-size: 1.3rem;
            font-weight: 700;
            margin-bottom: 10px;
        }
        .roadmap-card ul {
            list-style: none;
            padding: 0;
        }
        .roadmap-card ul li {
            padding: 4px 0;
            font-size: 0.92rem;
            color: var(--brown-light);
            display: flex;
            align-items: center;
            gap: 8px;
        }
        .roadmap-card ul li::before {
            content: '🥖';
            font-size: 0.8rem;
        }

        /* ===== CREATOR INITIATIVE ===== */
        .creator-section {
            background: linear-gradient(135deg, #FFF8F0, #FFF0E0);
            border-radius: var(--radius);
            padding: 60px 48px;
            margin-top: 20px;
            position: relative;
            overflow: hidden;
        }
        .creator-section::before {
            content: '🥖';
            position: absolute;
            right: -40px;
            bottom: -40px;
            font-size: 12rem;
            opacity: 0.06;
            pointer-events: none;
        }
        .creator-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 40px;
            align-items: center;
        }
        .creator-text h2 {
            font-size: 2.4rem;
            font-weight: 800;
            margin-bottom: 12px;
        }
        .creator-text p {
            color: v
